<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>تفاصيل الطلب</title></head><body>
<header class="top"><button class="back" onclick="history.back()">←</button><h2>تفاصيل الطلب</h2><span>🛺</span></header><main id="box" class="form"></main>
<script>
const id=new URLSearchParams(location.search).get('id'),a=JSON.parse(localStorage.getItem('orders')||'[]'),o=a.find(x=>String(x.id)===String(id)),box=document.getElementById('box');
if(!o) box.innerHTML='<div class="empty">الطلب غير موجود</div>'; else box.innerHTML=`<article class="form-card"><h3>${o.type}</h3><div class="details"><span>رقم الطلب</span><b>#${String(o.id).slice(-4)}</b><span>التاريخ</span><b>${o.date}</b><span>من</span><b>${o.from}</b><span>إلى</span><b>${o.to}</b><span>الحالة</span><b>${o.status}</b><span>ملاحظات</span><b>${o.notes||'—'}</b></div><button class="danger" onclick="cancelOrder()">إلغاء الطلب ✕</button></article>`;
function cancelOrder(){localStorage.setItem('orders',JSON.stringify(a.filter(x=>String(x.id)!==String(o.id))));location.href='orders.html'}
</script></body></html>
