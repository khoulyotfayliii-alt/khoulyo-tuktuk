<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل الطلب</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="back" href="orders.html">←</a><h2>تفاصيل الطلب</h2><span>🛺</span></header><main class="page"><div id="box"></div></main><script>let id=new URLSearchParams(location.search).get('id'),a=JSON.parse(localStorage.getItem('orders')||'[]'),o=a.find(x=>String(x.id)===String(id));box.innerHTML=o?`<article class="form-card"><div class="order-head"><div class="order-title">🛺 ${o.type}</div><span class="status ${o.status==='تم التأكيد'?'done':''}">${o.status}</span></div><div class="details-row"><span>رقم الطلب</span><b>#${String(o.id).slice(-4)}</b></div><div class="details-row"><span>التاريخ</span><b>${o.date}</b></div><div class="details-row"><span>من</span><b>${o.from||'—'}</b></div><div class="details-row"><span>إلى</span><b>${o.to||'—'}</b></div><div class="details-row"><span>ملاحظات</span><b>${o.notes||'—'}</b></div><button class="fullbtn" onclick="cancelOrder()">إلغاء الطلب ✕</button></article>`:'<div class="empty">الطلب غير موجود</div>';function cancelOrder(){a=a.filter(x=>x.id!==o.id);localStorage.setItem('orders',JSON.stringify(a));location.href='orders.html'}</script></body></html>
