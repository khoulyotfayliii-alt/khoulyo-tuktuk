<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><a class="back" href="index.html">←</a><h2>طلباتي</h2><span>▤</span></header><main class="page"><div class="orders-tabs"><button class="active" onclick="showMode('current',this)">الحالية</button><button onclick="showMode('old',this)">السابقة</button></div><div id="list"></div></main>
<nav class="bottom-nav"><a href="index.html">⌂<small>الرئيسية</small></a><a class="active" href="orders.html">▤<small>طلباتي</small></a><a href="more.html">⚙<small>المزيد</small></a></nav>
<script>
let data=JSON.parse(localStorage.getItem("orders")||"[]");
function icon(t){return t==="توصيل أغراض"?"📦":t==="نقل طلاب"?"🎓":t==="نقل موظفين"?"💼":"🛺"}
function showMode(mode,btn){document.querySelectorAll(".orders-tabs button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");let a=mode==="current"?data.filter(o=>o.status!=="مكتمل"):data.filter(o=>o.status==="مكتمل");list.innerHTML=a.length?a.map(o=>`<article class="order" onclick="location.href='details.html?id=${o.id}'"><div class="order-head"><div class="order-title">${icon(o.type)} ${o.type}</div><span class="status ${o.status==="مكتمل"?"done":""}">${o.status}</span></div><p>🕐 ${o.time}<br>📍 من: ${o.from||"—"}<br>📍 إلى: ${o.to||"—"}</p><small>${o.date}</small></article>`).join(""):"<div class='empty'>لا يوجد طلبات</div>"}
showMode("current",document.querySelector(".orders-tabs button"));
</script></body></html>
