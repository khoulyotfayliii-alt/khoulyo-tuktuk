<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="back" href="index.html">←</a><h2>طلباتي</h2><span>▤</span></header><main class="page"><div class="orders-tabs"><button class="active" onclick="show('current',this)">الحالية</button><button onclick="show('old',this)">السابقة</button></div><div id="list"></div></main><nav class="bottom-nav"><a href="index.html">⌂<small>الرئيسية</small></a><a class="active" href="orders.html">▤<small>طلباتي</small></a><a href="more.html">⚙<small>المزيد</small></a></nav><script>let data=JSON.parse(localStorage.getItem('orders')||'[]');function show(mode,btn){document.querySelectorAll('.orders-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');let a=mode==='current'?data.filter(o=>o.status!=='تم التأكيد'):data.filter(o=>o.status==='تم التأكيد');list.innerHTML=a.length?a.map((o,i)=>`<article class="order" onclick="location.href='details.html?id=${o.id}'"><div class="order-head"><div class="order-title">${o.type==='توصيل أغراض'?'📦':o.type==='نقل طلاب'?'🎓':o.type==='نقل موظفين'?'💼':'🛺'} ${o.type}</div><span class="status ${o.status==='تم التأكيد'?'done':''}">${o.status}</span></div><p>🕐 ${o.time}<br>📍 من: ${o.from||'—'}<br>📍 إلى: ${o.to||'—'}</p><small>${o.date}</small></article>`).join(''):'<div class="empty">لا يوجد طلبات</div>'}show('current',document.querySelector('.orders-tabs button'));</script></body></html>
