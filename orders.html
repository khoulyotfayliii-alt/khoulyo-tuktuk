<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>طلباتي</title></head><body>
<header class="top"><button class="back" onclick="location.href='index.html'">←</button><h2>طلباتي</h2><span>▤</span></header>
<main id="list" class="list"></main><nav class="bottom"><a href="index.html">⌂<small>الرئيسية</small></a><a class="active" href="orders.html">▤<small>طلباتي</small></a><a href="more.html">⚙<small>المزيد</small></a></nav>
<script>
const list=document.getElementById('list'), a=JSON.parse(localStorage.getItem('orders')||'[]');
list.innerHTML=a.length?a.map(o=>`<article class="order" onclick="location.href='details.html?id=${o.id}'"><div class="orderrow"><b>${o.type}</b><span class="status">${o.status}</span></div><p>من: ${o.from}</p><p>إلى: ${o.to}</p><small>${o.date}${o.time?' • '+o.time:''}</small></article>`).join(''):'<div class="empty">لا يوجد لديك طلبات حالياً</div>';
</script></body></html>
