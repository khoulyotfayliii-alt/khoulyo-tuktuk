<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>طلب</title></head><body>
<header class="top"><button class="back" onclick="history.back()">←</button><h2 id="title">طلب مشوار</h2><span id="typeIcon">🛺</span></header>
<main class="form">
<div class="field"><label>نوع الطلب</label><input id="type" readonly></div>
<div class="field"><label>📍 مكان الانطلاق</label><input id="from" placeholder="مثال: النبطية"></div>
<div class="field"><label>📍 الوجهة</label><input id="to" placeholder="مثال: كفررمان"></div>
<div class="field"><label>🕐 الوقت (اختياري)</label><input id="time" type="time"></div>
<div class="field"><label>💬 ملاحظات (اختياري)</label><textarea id="notes" placeholder="مثال: قرب المدرسة"></textarea></div>
<button class="send" onclick="submitOrder()">إرسال الطلب 🚀</button>
<p class="small">سيظهر طلبك في قسم «طلباتي» بعد الإرسال.</p></main>
<script>
const params=new URLSearchParams(location.search), type=params.get('type')||'مشوار عادي';
document.getElementById('type').value=type; document.getElementById('title').textContent=type;
function submitOrder(){
 const from=document.getElementById('from').value.trim(),to=document.getElementById('to').value.trim();
 if(!from||!to){alert('رجاءً عبّي مكان الانطلاق والوجهة');return}
 const orders=JSON.parse(localStorage.getItem('orders')||'[]');
 orders.unshift({id:Date.now(),type,from,to,time:document.getElementById('time').value,notes:document.getElementById('notes').value,status:'قيد التنفيذ',date:new Date().toLocaleDateString('ar-LB')});
 localStorage.setItem('orders',JSON.stringify(orders)); location.href='orders.html';
}
</script></body></html>
