<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><a class="back" href="more.html">←</a><h2>لوحة التحكم</h2><span>⚙️</span></header><main class="page">
<div class="admin-stats"><div class="stat blue"><b id="new">0</b>طلبات جديدة</div><div class="stat yellow"><b id="pending">0</b>قيد المعالجة</div><div class="stat green"><b id="done">0</b>مكتملة</div></div>
<div id="adminList"></div></main>
<script>
const a=JSON.parse(localStorage.getItem("orders")||"[]");new.textContent=a.length;pending.textContent=a.filter(x=>x.status==="قيد التنفيذ").length;done.textContent=a.filter(x=>x.status==="مكتمل").length;
adminList.innerHTML=a.length?a.map(o=>`<article class="order"><div class="order-head"><div class="order-title">🛺 ${o.type}</div><span class="status">${o.status}</span></div><p>📞 ${o.phone}<br>📍 ${o.from||"—"} → ${o.to||"—"}<br>🕐 ${o.time}</p></article>`).join(""):"<div class='empty'>لا توجد طلبات بعد</div>";
</script></body></html>
