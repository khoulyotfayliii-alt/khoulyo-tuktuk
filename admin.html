<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="back" href="more.html">←</a><div class="brand"><b>K</b><span>لوحة التحكم<small>Khoulyo</small></span></div><span>🔔</span></header><main class="page"><div class="admin-stats"><div class="stat blue"><b id="new">0</b>طلبات جديدة</div><div class="stat yellow"><b id="processing">0</b>قيد المعالجة</div><div class="stat green"><b id="doneCount">0</b>مكتملة</div></div><div class="section-title"><h1>طلبات الزبائن</h1></div><div class="admin-actions"><button onclick="render()">تحديث الطلبات</button><button onclick="clearAll()">حذف الكل</button></div><div id="adminList"></div></main><script>function render(){let a=JSON.parse(localStorage.getItem('orders')||'[]');new.textContent=a.filter(o=>o.status==='قيد التنفيذ').length;processing.textContent=a.filter(o=>o.status==='تم التأكيد').length;doneCount.textContent=a.filter(o=>o.status==='مكتمل').length;adminList.innerHTML=a.length?a.map((o,i)=>`<article class="order"><div class="order-head"><div class="order-title">${o.type==='توصيل أغراض'?'📦':o.type==='نقل طلاب'?'🎓':o.type==='نقل موظفين'?'💼':'🛺'} ${o.type}</div><span class="status ${o.status==='تم التأكيد'?'done':''}">${o.status}</span></div><p>👤 ${o.phone}<br>📍 من: ${o.from||'—'}<br>📍 إلى: ${o.to||'—'}<br>🕐 ${o.time}<br>💬 ${o.notes||'—'}</p><div class="admin-buttons"><button class="ok" onclick="done(${i})">✓ تأكيد</button><a class="wa" href="https://wa.me/961${String(o.phone).replace(/^0/,'')}" target="_blank">واتساب</a><button class="danger" onclick="removeO(${i})">حذف</button></div></article>`).join(''):'<div class="empty">لا يوجد طلبات</div>'}function save(a){localStorage.setItem('orders',JSON.stringify(a));render()}function done(i){let a=JSON.parse(localStorage.getItem('orders')||'[]');a[i].status='تم التأكيد';save(a)}function removeO(i){let a=JSON.parse(localStorage.getItem('orders')||'[]');a.splice(i,1);save(a)}function clearAll(){if(confirm('أكيد تمسح كل الطلبات؟')){localStorage.removeItem('orders');render()}}render();</script></body></html>
